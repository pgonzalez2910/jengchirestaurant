


<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>Jeng Chi — Place Order</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.6/Sortable.min.js"></script>
<style>
:root{--navy:#173a63;--navy2:#244f7d;--line:#aebdcc;--soft:#eef3f8;--text:#17283b;--muted:#66788a;--green:#2f7d4a;--amber:#b66b00;--red:#b42318;}
*{box-sizing:border-box}
html,body{margin:0;background:#f4f7fa;color:var(--text);font-family:Arial,Helvetica,sans-serif}
body{min-height:100vh}
header{position:sticky;top:0;z-index:20;background:#fff;border-bottom:2px solid #8da2b6;padding:10px 18px;display:flex;align-items:center;gap:14px;box-shadow:0 2px 8px rgba(28,52,74,.08)}
.logo{width:70px;height:42px;object-fit:contain}
.brand h1{font-size:18px;margin:0;font-weight:800}
.brand div{font-size:11px;color:var(--muted);margin-top:2px}
.net{margin-left:auto;border:1px solid var(--line);border-radius:999px;padding:6px 10px;font-size:11px;font-weight:700;background:#fff}
.net.off{border-color:#e3a6a2;color:var(--red);background:#fff5f4}
main{max-width:1500px;margin:0 auto;padding:16px}
.hidden{display:none!important}
.landing{max-width:720px;margin:50px auto;background:#fff;border:1px solid var(--line);border-radius:12px;padding:28px;box-shadow:0 10px 28px rgba(20,48,73,.10);text-align:center}
.landing h2{margin:0 0 7px;font-size:24px}
.landing p{margin:0 0 22px;color:var(--muted);font-size:13px}
.persons{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.person{padding:22px;border:2px solid #91a6ba;border-radius:10px;background:#fff;font-size:20px;font-weight:800;cursor:pointer}
.person:hover{background:#edf5fd;border-color:var(--navy)}
.topbar{background:#fff;border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:12px;display:flex;gap:10px;align-items:end;flex-wrap:wrap}
.titlebox{min-width:250px;flex:1}
.titlebox h2{margin:0;font-size:20px}
.titlebox p{margin:3px 0 0;font-size:11px;color:var(--muted)}
.field{display:flex;flex-direction:column;gap:4px}
.field label{font-size:10px;font-weight:800;text-transform:uppercase;color:#4b6073;letter-spacing:.04em}
input,select,button{font:inherit}
.field input,.field select{height:36px;border:1px solid var(--line);border-radius:6px;background:#fff;padding:0 9px}
.search{min-width:260px;flex:1}
.metrics{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:10px}
.metric{background:#fff;border:1px solid #c7d2dc;border-radius:999px;padding:6px 10px;font-size:11px}
.metric strong{font-size:12px}
.notice{display:none;margin-bottom:10px;border:1px solid #9fb2c3;background:#eef6fd;border-radius:7px;padding:9px 11px;font-size:12px;font-weight:700}
